name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ── 1. Build, test, deploy the React app ─────────────────────────────────────
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build
        env:
          VITE_GITHUB_OWNER: ${{ github.repository_owner }}
          VITE_GITHUB_REPO: ${{ github.event.repository.name }}
          VITE_GITHUB_DATA_BRANCH: data
          VITE_GITHUB_TOKEN: ${{ secrets.DATA_PAT }}
        run: npm run build

      - name: Copy 404.html for SPA routing
        run: cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ── 2. Ensure data branch + db.json exist ────────────────────────────────────
  init-data-branch:
    runs-on: ubuntu-latest
    needs: build-and-deploy
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Create data branch and db.json if not exists
        env:
          GH_TOKEN: ${{ secrets.DATA_PAT }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          # Check if data branch exists
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$OWNER/$REPO/branches/data")

          if [ "$STATUS" = "404" ]; then
            echo "Creating data branch..."
            # Get SHA of main HEAD
            SHA=$(curl -s \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$OWNER/$REPO/git/refs/heads/main" \
              | python3 -c "import sys,json; print(json.load(sys.stdin)['object']['sha'])")

            # Create data branch from main
            curl -s -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$OWNER/$REPO/git/refs" \
              -d "{\"ref\":\"refs/heads/data\",\"sha\":\"$SHA\"}"
            echo "data branch created."
          else
            echo "data branch already exists."
          fi

          # Check if db.json exists on data branch
          DB_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$OWNER/$REPO/contents/db.json?ref=data")

          if [ "$DB_STATUS" = "404" ]; then
            echo "Creating initial db.json..."
            CONTENT=$(echo '{"users":[],"requirements":[],"vendors":[],"installations":[],"examDates":[],"quotations":[],"auditLogs":[]}' | base64 -w 0)
            curl -s -X PUT \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$OWNER/$REPO/contents/db.json" \
              -d "{\"message\":\"init: create db.json\",\"content\":\"$CONTENT\",\"branch\":\"data\"}"
            echo "db.json created."
          else
            echo "db.json already exists."
          fi
